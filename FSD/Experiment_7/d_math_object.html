<!DOCTYPE html>
<html>
<head>
  <title>Math Object Example</title>
</head>
<body>
  <h2>JavaScript Math Object Properties and Methods</h2>

  <button onclick="showConstants()">Show Constants</button>
  <button onclick="showMethods()">Show Methods</button>

  <h3>Output:</h3>
  <p id="result"></p>

  <script>
    function showConstants() {
      document.getElementById("result").innerHTML =
        "Math.PI = " + Math.PI + "<br>" +
        "Math.E = " + Math.E;
    }

    function showMethods() {
      let num = 9.7;
      let output =
        "Number: " + num + "<br>" +
        "Square Root: " + Math.sqrt(16) + "<br>" +
        "Power (3²): " + Math.pow(3, 2) + "<br>" +
        "Round: " + Math.round(num) + "<br>" +
        "Ceil: " + Math.ceil(num) + "<br>" +
        "Floor: " + Math.floor(num) + "<br>" +
        "Random (0–1): " + Math.random();
      document.getElementById("result").innerHTML = output;
    }
  </script>
</body>
</html>
