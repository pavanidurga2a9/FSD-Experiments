<!DOCTYPE html>
<html>
<head>
<title>Document Object Example</title>
</head>
<body>

<h2 id="demo">Welcome!</h2>

<script>
document.write("<p>Page Title: " + document.title + "</p>");
document.write("<p>Page URL: " + document.URL + "</p>");

document.getElementById("demo").innerHTML = "This text is changed using innerHTML!";
</script>

</body>
</html>
