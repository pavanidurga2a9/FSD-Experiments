<!DOCTYPE html>
<html>
<head>
<title>Fixed Background Image</title>
<style>
body {
  height: 200vh; 
  background-image: url('https://www.w3schools.com/html/img_girl.jpg');
  background-repeat: no-repeat;
  background-position: center 50%; 
  background-attachment: fixed; 
  background-size: 400px; 
  font-family: Arial;
}
h2 {
  text-align: center;
  color: darkblue;
  margin-top: 40px;
}
p {
  text-align: center;
  font-size: 18px;
  margin-top: 100px;
}
</style>
</head>
<body>
<h2>Beautiful Background</h2>
<p>
This example shows a background image placed halfway down the page.  
The image remains fixed in position even when you scroll up or down.
</p>
</body>
</html>
